    "macos-x86_64": { "root": "targets/macos-x86_64", "executables": { "cli": "bin/spotify", "daemon": "bin/spotify-daemon" }, "install_script": "install.sh" },
    "linux-aarch64": { "root": "targets/linux-aarch64", "executables": { "cli": "bin/spotify", "daemon": "bin/spotify-daemon" } },
    "linux-x86_64": { "root": "targets/linux-x86_64", "executables": { "cli": "bin/spotify", "daemon": "bin/spotify-daemon" } },
    "windows-aarch64": { "root": "targets/windows-aarch64", "executables": { "cli": "bin/spotify.exe", "daemon": "bin/spotify-daemon.exe" } },
